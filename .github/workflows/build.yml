name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create index.html
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Zikra AI Companion</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: #0f172a;
                color: #f8fafc;
                display: flex;
                flex-direction: column;
                height: 100vh;
              }
              header {
                padding: 16px;
                background: #1e293b;
                text-align: center;
                border-bottom: 1px solid #334155;
              }
              header h1 { font-size: 1.2rem; color: #38bdf8; }
              #chat-container {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }
              .message {
                max-width: 80%;
                padding: 12px 16px;
                border-radius: 12px;
                font-size: 0.95rem;
                line-height: 1.4;
              }
              .bot {
                background: #1e293b;
                align-self: flex-start;
                border-bottom-left-radius: 2px;
              }
              .user {
                background: #2563eb;
                align-self: flex-end;
                border-bottom-right-radius: 2px;
              }
              #input-container {
                padding: 12px;
                background: #1e293b;
                display: flex;
                gap: 8px;
              }
              input {
                flex: 1;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #334155;
                background: #0f172a;
                color: #fff;
                outline: none;
              }
              button {
                padding: 12px 20px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 8px;
                font-weight: bold;
              }
            </style>
          </head>
          <body>
            <header>
              <h1>Zikra AI Companion v1.0</h1>
            </header>
            
            <div id="chat-container">
              <div class="message bot">
                Hello! Main Zikra AI Companion hoon. Main aapki kya madad kar sakta hoon?
              </div>
            </div>

            <div id="input-container">
              <input type="text" id="userInput" placeholder="Kuchh likhein...">
              <button onclick="sendMessage()">Send</button>
            </div>

            <script>
              function sendMessage() {
                const input = document.getElementById('userInput');
                const text = input.value.trim();
                if (!text) return;

                const chat = document.getElementById('chat-container');
                
                const userMsg = document.createElement('div');
                userMsg.className = 'message user';
                userMsg.textContent = text;
                chat.appendChild(userMsg);

                input.value = '';
                chat.scrollTop = chat.scrollHeight;

                setTimeout(() => {
                  const botMsg = document.createElement('div');
                  botMsg.className = 'message bot';
                  botMsg.textContent = "Zikra AI v1.0 Ready!";
                  chat.appendChild(botMsg);
                  chat.scrollTop = chat.scrollHeight;
                }, 800);
              }
            </script>
          </body>
          </html>
          EOF

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        uses: cordova-actions/cordova-build@v1
        with:
          platform: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zikra-AI-Companion-v1.0
          path: output/*.apk
